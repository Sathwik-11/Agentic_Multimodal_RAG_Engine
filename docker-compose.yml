services:
  rag:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CHROMA_DIR: /data/chroma
      CHECKPOINT_PATH: /data/checkpoints/rag.sqlite
      GUARDRAILS_DIR: /app/guardrails
    volumes:
      - rag-data:/data
      - ./documents:/app/documents
    restart: unless-stopped

volumes:
  rag-data:
